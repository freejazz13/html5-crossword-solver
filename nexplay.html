<body>
    <div class="container">
        <header>
            <h1>Select your crossword:</h1>
            <div class="stats">
                <span id="stats-files">Files: 0</span>
            </div>
        </header>

        <div id="loading">Loading archive...</div>
        <div id="file-grid"></div>
    </div>

    <script>

//===============================================================================================
async function loadArchive(url) {
    try {
        const resp = await fetch(url);
        const blob = await resp.blob();
        const zip = await JSZip.loadAsync(blob);

        const fileGrid = document.getElementById('file-grid');
        const loading = document.getElementById('loading');

        // Extract and parse file data
        const filesData = await processZip(zip);

        loading.style.display = 'none';

        if (filesData.length === 0) {
            fileGrid.innerHTML = '<div class="no-files">No files found in archive</div>';
            return;
        }

        // Update stats
        document.getElementById('stats-files').textContent = `Files: ${filesData.length}`;

        // Create stickers using the parsed data
        for (const data of filesData) {
            // Pass the parsed object to your UI generator
            const sticker = await createFileSticker(data);
            fileGrid.appendChild(sticker);
        }

    } catch (error) {
        document.getElementById('loading').textContent = 'Error loading archive: ' + error.message;
        console.error('Archive loading error:', error);
    }
}

async function processZip(zip) {
    const fileEntries = Object.keys(zip.files)
        .filter(path => !zip.files[path].dir && path.toLowerCase().endsWith('.puz'))
        .map(path => ({ path, file: zip.files[path] }));

    return await Promise.all(fileEntries.map(async (entry) => {
        try {
            // 1. Get the actual bytes
            const buffer = await entry.file.async("uint8array");

            // 2. Parse metadata from bytes
            const puzData = parsePuzBuffer(buffer);

            // 3. Return everything, including the raw data (buffer)
            return {
                path: entry.path,
                data: buffer, // This is the actual file data
                ...puzData
            };
        } catch (err) {
            console.error(`Error parsing ${entry.path}:`, err);
            return null;
        }
    })).then(results => results.filter(r => r !== null));
}

async function processZip000(zip) {
    const fileEntries = Object.keys(zip.files)
    .filter(path => !zip.files[path].dir && path.toLowerCase().endsWith('.puz'))
    .map(path => ({ path, file: zip.files[path] }));

    const results = await Promise.all(fileEntries.map(async (entry) => {
        try {
            const buffer = await entry.file.async("uint8array");
            const puzData = parsePuzBuffer(buffer);
            return { file: entry.file, path: entry.path, ...puzData };
        } catch (err) {
            console.error(`Error parsing ${entry.path}:`, err);
            return null;
        }
    }));

    return results.filter(r => r !== null);
}

function parsePuzBuffer(data) {
    const decoder = new TextDecoder('iso-8859-15');
    const width = data[0x2c];
    const height = data[0x2d];
    const nbclues = data[0x2e] | (data[0x2f] << 8);

    const solStart = 0x34;
    const gridSize = width * height;
    const solEnd = solStart + gridSize;
    const layoutEnd = solEnd + gridSize;

    const sol = decoder.decode(data.slice(solStart, solEnd));
    const layout = decoder.decode(data.slice(solEnd, layoutEnd));

    let pos = layoutEnd;
    const readNullTerminated = () => {
        let end = pos;
        while (end < data.length && data[end] !== 0) end++;
        const str = decoder.decode(data.slice(pos, end));
        pos = end + 1;
        return str;
    };

    return {
        width,
        height,
        nbclues,
        title: readNullTerminated(),
        author: readNullTerminated(),
        sol,
        layout
    };
}
function createFileSticker(puz) {
    const filename = puz.path.split('/').pop();

    const sticker = document.createElement('div');
    sticker.className = 'file-sticker';

    sticker.innerHTML = `
        <div class="file-title">${puz.title || 'Untitled'}</div>
        <div class="file-details">
            <div class="file-author">${puz.author || 'Unknown'}</div>
            <div class="file-type">${puz.width}x${puz.height}</div>
            <div class="file-name">${filename}</div>
        </div>
    `;

    sticker.addEventListener('click', async () => {
    // 1. Create a Blob from the Uint8Array
    const blob = new Blob([puz.data], { type: 'application/x-crossword' });

    // 2. Convert Blob to Base64 via FileReader
    const reader = new FileReader();
    reader.onloadend = () => {
        const base64String = reader.result
            .split(',')[1]; // Remove the "data:application/x-crossword;base64," prefix

        // 3. URL encode and open
        const puzdata = encodeURIComponent(base64String);
        window.open(`/play?data=${puzdata}`, '_blank');
    };
    reader.readAsDataURL(blob);
  });
