<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPlay</title>
    <link rel="icon" type="image/x-svg" href="images/nexplay.svg">
    <link rel="stylesheet" href="nexplay.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script> -->
    <script src="./lib/jquery.js"></script>
    <script src="./lib/jszip.min.js"></script>
    <script src="./lib/bz2.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-actions">
                <label class="cloud-label"> <input type="checkbox" id="cloud-check"> Cloud Export </label>
                <button class="action-btn" onclick="showHelp()" title="Aide en francais">Help</button>
                <button class="action-btn" id="export-btn" title="Save current games progress">Export</button>
                <button class="action-btn" id="import-btn" title="Import from a backup">Import</button>
            </div>
            <div id="qr-container"
                style="display:none; position:fixed; right:20px; top:100px; width:200px; background:white; padding:15px; border:2px solid #333; border-radius:8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index:100; text-align:center;">
                <div id="qrcode" style="margin-bottom:10px;"></div>
                <input type="text" id="qr-link" readonly onclick="this.select()"
                    style="width:100%; font-size:10px; padding:5px; border:1px solid #ccc; cursor:pointer; text-align:center;">
                <button onclick="document.getElementById('qr-container').style.display='none'"
                    style="margin-top:10px; width:100%; cursor:pointer; font-size:12px;">Close</button>
            </div>
            <div class="breadcrumb" id="breadcrumb">
                <span class="breadcrumb-item active" id="breadcrumb-volumes">Collections</span>
                <span class="breadcrumb-sep" id="breadcrumb-sep" style="display:none">›</span>
                <span class="breadcrumb-item" id="breadcrumb-current" style="display:none"></span>
            </div>
            <h1 id="page-title">Choose a volume:</h1>
            <div class="stats">
                <span id="stats-files"></span>
                <button id="btn-refresh" style="display:none;margin-left:12px" title="Update puzzles status">↺ Refresh</button>
                <button id="btn-resort" style="display:none;margin-left:12px" title="(instead of filenames)">Sort by Title</button>
            </div>
        </header>
        <div id="loading">Loading ...</div>
        <div id="file-grid"></div>
        <div id="toast">Backup Created!</div>
    </div>

    <script type="module" src="./nexplay.js"></script>

    <!-- Put this in both index.html AND nexplay.html -->
    <script>
        if ('serviceWorker' in navigator) {
            // Register with absolute path
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('SW active at:', reg.scope);

                // Handle updates
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            // New content available, refresh to apply
                            window.location.reload();
                        }
                    };
                };
            });

            // Essential for Private Windows: Sync tabs when the SW takes control
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
            });
        }
    </script>
</body>

</html>
