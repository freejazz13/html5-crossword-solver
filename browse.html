<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPlay</title>
    <link rel="stylesheet" href="browse.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Select your crossword:</h1>
            <div class="stats">
                <span id="stats-files">Files: 0</span>
            </div>
        </header>

        <div id="loading">Loading archive...</div>
        <div id="file-grid"></div>
    </div>

    <script>
        // Metadata extraction function - will be enhanced later
    async function extractMetadata(file,filename) {
        const buffer = await file.arrayBuffer();
        const data = new Uint8Array(buffer);
        const decoder = new TextDecoder('iso-8859-15');

        const width = data[0x2c];
        const height = data[0x2d];
        const nbclues = data[0x2e] | (data[0x2f] << 8);

        const solStart = 0x34;
        const gridSize = width * height;

        // Extract Solution and Layout
        const solEnd = solStart + gridSize;
        const sol = decoder.decode(data.slice(solStart, solEnd));

        const layoutEnd = solEnd + gridSize;
        const layout = decoder.decode(data.slice(solEnd, layoutEnd));

        // Extract Null-Terminated Metadata
        let pos = layoutEnd;
        function readNullTerminated() {
            let end = pos;
            while (end < data.length && data[end] !== 0) end++;
            const str = decoder.decode(data.slice(pos, end));
            pos = end + 1;
            return str;
        }

        const title = readNullTerminated();
        const author = readNullTerminated();

        return { width, height, nbclues, title, author, sol, layout };
    }

        async function extractMetadata(file, filename) {
            // Placeholder for future metadata extraction
            // Will extract title and other metadata from file content
            return {
                title: filename.replace(/\.[^/.]+$/, ''), // Remove extension for now
                // Future: extract from file content (JPZ, IPUZ, PUZ metadata, etc.)
            };
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function getFileType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const types = {
                'puz': 'Across Lite',
                'jpz': 'JPZ Crossword',
                'ipuz': 'iPuz Format',
                'xml': 'XML Document',
                'json': 'JSON Document',
                'txt': 'Text File',
                'html': 'HTML File',
                'pdf': 'PDF Document'
            };
            return types[ext] || ext.toUpperCase();
        }

        async function createFileSticker(path, file) {
            const filename = path.split('/').pop();
            const metadata = await extractMetadata(file, filename);

            const sticker = document.createElement('div');
            sticker.className = 'file-sticker';

            sticker.innerHTML = `
                <div class="file-title">${metadata.title}</div>
                <div class="file-details">
                    <div class="file-size">${formatFileSize(file._data.uncompressedSize)}</div>
                    <div class="file-type">${getFileType(filename)}</div>
                    <div class="file-name">${filename}</div>
                </div>
            `;

            sticker.addEventListener('click', async () => {
                const blob = await file.async("blob");
                window.open(URL.createObjectURL(blob), '_blank');
            });

            return sticker;
        }

        async function loadArchive(url) {
            try {
                const resp = await fetch(url);
                const zip = await JSZip.loadAsync(await resp.blob());
		results = processZip(zip);

                const fileGrid = document.getElementById('file-grid');
                const loading = document.getElementById('loading');

                loading.style.display = 'none';
                // Filter out directories
                /*const files = Object.keys(zip.files)
                    .filter(path => !zip.files[path].dir)
                    .map(path => ({ path, file: zip.files[path] }));

                if (files.length === 0) {
                    fileGrid.innerHTML = '<div class="no-files">No files found in archive</div>';
                    return;
                }
*/

                // Update stats
                document.getElementById('stats-files').textContent = `Files: ${files.length}`;

                // Create stickers for each file
                for (const { path, file } of files) {
                    const sticker = await createFileSticker(path, file);
                    fileGrid.appendChild(sticker);
                }

            } catch (error) {
                document.getElementById('loading').textContent = 'Error loading archive: ' + error.message;
                console.error('Archive loading error:', error);
            }
        }

      	async function processZip(zip) {
            const fileEntries = Object.keys(zip.files)
                .filter(path => !zip.files[path].dir)
                .map(path => ({ path, file: zip.files[path] }));
        
            const results = await Promise.all(fileEntries.map(async (entry) => {
                // Get the binary data from JSZip
                const buffer = await entry.file.async("uint8array");
        
                try {
                    // Reuse the previously defined getPuzData logic
                    const puzData = await parsePuzBuffer(buffer);
                    return { path: entry.path, ...puzData };
                } catch (err) {
                    console.error(`Error parsing ${entry.path}:`, err);
                    return null;
                }
            }));
        
            return results.filter(r => r !== null);
        }
        
        async function parsePuzBuffer(data) {
            const decoder = new TextDecoder('iso-8859-15');
            const width = data[0x2c];
            const height = data[0x2d];
            const nbclues = data[0x2e] | (data[0x2f] << 8);
        
            const solStart = 0x34;
            const gridSize = width * height;
            const solEnd = solStart + gridSize;
            const layoutEnd = solEnd + gridSize;
        
            const sol = decoder.decode(data.slice(solStart, solEnd));
            const layout = decoder.decode(data.slice(solEnd, layoutEnd));
        
            let pos = layoutEnd;
            const readNullTerminated = () => {
                let end = pos;
                while (end < data.length && data[end] !== 0) end++;
                const str = decoder.decode(data.slice(pos, end));
                pos = end + 1;
                return str;
            };
        
            return {
                width,
                height,
                nbclues,
                title: readNullTerminated(),
                author: readNullTerminated(),
                sol,
                layout
            };
        }

        loadArchive('crosswords/files.zip');
    </script>
</body>
</html>
